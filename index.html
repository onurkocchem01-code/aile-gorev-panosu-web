<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — side rail on wide screens, bottom tab bar on phones; content as a calm "kitchen noticeboard" of cards */
:root{
  /* Tek, açık ve canlı aile teması: hava mavisi zemin, kobalt vurgu, güneş sarısı işaretleyici */
  --bg:#F3F6FF; --surface:#FFFFFF; --surface-2:#EEF2FC; --line:#DCE3F5;
  --ink:#172041; --ink-2:#465074; --ink-3:#7A84A6;
  --accent:#3056F5; --accent-soft:#E2E9FF; --accent-ink:#FFFFFF;
  --marker:#FFC83D; --marker-soft:#FFF3CF;
  --mint:#1FB58F; --mint-soft:#DAF5EC; --coral:#FF6B57; --coral-soft:#FFE5E0; --sky-soft:#DDF0FF;
  --good:#16A06E; --good-soft:#DBF4E8; --warn:#C27A06; --warn-soft:#FFF0D2; --low:#E04B37; --low-soft:#FFE3DE;
  --shadow:0 1px 2px rgba(23,32,65,.05),0 6px 18px rgba(48,86,245,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100%}
.rail{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink-3);font-size:11.5px;font-weight:600;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:232px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:4px 10px 18px}
  .rail .tab{flex:0;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px}
  .rail .tab[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:28px 40px}
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.1}
.brand-sub{font-size:12px;color:var(--ink-3)}

/* page head */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.phead h1{font-size:clamp(26px,5vw,36px);font-weight:800;line-height:1.1}
.sub{color:var(--ink-2);margin:4px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:18px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--low);border-color:var(--low)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:16px;height:16px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex-shrink:0;border:2px solid var(--surface)}
.av.lg{width:44px;height:44px;font-size:16px}
.avs{display:flex}
.avs .av+.av{margin-left:-8px}

/* member boxes */
.mboxes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--shadow)}
.mbox .top{display:flex;align-items:center;gap:10px}
.mbox .nm{font-weight:700;line-height:1.2}
.mbox .rl{font-size:12px;color:var(--ink-3)}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-low{background:var(--low-soft);color:var(--low)}.p-none{background:var(--surface-2);color:var(--ink-3)}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-low{color:var(--low)}
.b-good>i{background:var(--good)}.b-warn>i{background:var(--warn)}.b-low>i{background:var(--low)}

/* task rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .tt{flex:1;min-width:0}
.row .t1{font-weight:600;overflow-wrap:anywhere}
.row .t2{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tap{cursor:pointer;border-radius:10px}
.row.tap:hover{background:var(--surface-2)}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.new{background:var(--marker-soft);border-color:transparent;color:var(--ink)}
.assign{border:1px dashed var(--ink-3);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:transparent}
.check svg{width:16px;height:16px}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.row.done .t1{text-decoration:line-through;color:var(--ink-3)}

.cathead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:4px}
.catdot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;flex:1;min-width:200px}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ring */
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;flex:1;min-width:220px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.kpi .k{font-size:12.5px;color:var(--ink-3)}

/* charts */
.cols{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;position:relative}
.col i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.col.today i{background:var(--marker)}
.col b{font-size:11px;color:var(--ink-2);font-weight:700;margin-bottom:3px}
.xl{display:flex;gap:6px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3);min-width:0;overflow:hidden}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:700}

/* member tabs */
.mtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mtab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-weight:600;white-space:nowrap}
.mtab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h3{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2)}
.input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
textarea.input{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.confirm{background:var(--low-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.empty{text-align:center;padding:28px 12px;color:var(--ink-2)}
.empty h3{font-size:19px;margin-bottom:6px;color:var(--ink)}
.note{font-size:13px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.note b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}

/* onboarding */
.onb{max-width:560px;margin:4vh auto 0;display:flex;flex-direction:column;gap:18px}
.onb h1{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1.05}
.onb .lead{font-size:17px;color:var(--ink-2);margin:0}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.mini span{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600}
.mini span button{border:0;background:none;color:var(--ink-3);padding:0 6px;font-size:16px;line-height:1}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .input{flex:1;min-width:140px}
.addrow select.input{flex:0 0 auto;width:auto}
.code{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.14em;background:var(--marker-soft);padding:6px 14px;border-radius:10px;display:inline-block}
/* ---- tanıtım sayfası ---- */
.land{display:flex;flex-direction:column;gap:64px;padding-bottom:24px}
.lhero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-top:8px}
@media (max-width:860px){.lhero{grid-template-columns:minmax(0,1fr);gap:36px}}
.lhero-text{display:flex;flex-direction:column;gap:22px;min-width:0}
.lhero h1{font-size:clamp(40px,7.4vw,72px);font-weight:800;line-height:.98;letter-spacing:-.03em}
.hl{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);padding:0 .06em}
.lead{font-size:clamp(16px,2.1vw,19px);color:var(--ink-2);margin:0;max-width:34em}
.btn.lg{padding:13px 22px;font-size:15.5px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column-reverse}
.stats dt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stats dd{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}

.demo{position:relative;padding:34px 18px 46px;min-width:0}
.demo::before{content:"";position:absolute;inset:0;border-radius:28px;background-color:var(--marker-soft);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:16px 16px}
.demo-board{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(24,32,43,.12);display:flex;flex-direction:column;gap:4px;transform:rotate(-1.2deg)}
.demo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.demo-h{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.demo-ring{position:relative;width:52px;height:52px}
.demo-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.demo-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px}
.demo-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-weight:600;font-size:14px}
.demo-row .check{width:24px;height:24px}
.demo-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-row.done .demo-t{text-decoration:line-through;color:var(--ink-3)}
.demo-note{position:absolute;top:6px;right:22px;background:var(--marker);color:#2A2205;padding:10px 14px;border-radius:4px 4px 14px 4px;font-size:13px;line-height:1.25;transform:rotate(4deg);box-shadow:0 6px 14px rgba(24,32,43,.15)}
.demo-pill{position:absolute;left:4px;bottom:10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;font-size:13px;box-shadow:0 6px 16px rgba(24,32,43,.12)}
@media (prefers-reduced-motion:no-preference){.demo-note{animation:sway 6s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.5deg) translateY(-3px)}}}

.lsec{display:flex;flex-direction:column;gap:22px;scroll-margin-top:20px}
.lhead{display:flex;flex-direction:column;gap:6px;max-width:40em}
.lhead h2{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.08}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.steps li{position:relative;padding:22px 20px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.steps h3{font-size:19px;margin:12px 0 6px}
.steps p{margin:0;color:var(--ink-2)}
.sn{font-family:var(--f-display);font-weight:800;font-size:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.steps li:nth-child(2) .sn{background:var(--marker);color:var(--ink)}.steps li:nth-child(3) .sn{background:var(--mint);color:#fff}
.roles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.role{border-radius:var(--r);padding:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.role h3{font-size:20px}
.role-lead{margin:0;font-weight:600;color:var(--ink)}
.role ul,.rolecard ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;font-size:14px}
.role-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.role-ic svg{width:22px;height:22px}
.role-ic.sm{width:36px;height:36px;flex-shrink:0}
.r-e .role-ic,.role-ic.r-e{background:var(--accent-soft);color:var(--accent)}
.r-c .role-ic,.role-ic.r-c{background:var(--marker-soft);color:var(--warn)}
.role.r-e{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 55%)}.role.r-c{background:linear-gradient(180deg,var(--marker-soft),var(--surface) 55%)}.role.r-o{background:linear-gradient(180deg,var(--mint-soft),var(--surface) 55%)}.role.r-a{background:linear-gradient(180deg,var(--coral-soft),var(--surface) 55%)}
.r-o .role-ic,.role-ic.r-o{background:var(--mint-soft);color:var(--mint)}
.r-a .role-ic,.role-ic.r-a{background:var(--coral-soft);color:var(--coral)}
.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.cat-top{display:flex;justify-content:space-between;align-items:center}
.cat-ic{width:32px;height:32px;border-radius:9px;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}

const S={mode:null,code:null,ready:false,exists:true,state:{name:"",members:{},tasks:{}},logs:{},readOnly:false,
  view:"bugun",setup:null,focus:null,dayOff:0,cat:"all",filter:"all",q:"",member:null,amember:null,period:7,analizTab:"birey",note:null};

function isObj(v){return v&&typeof v==="object"&&!Array.isArray(v)}
function merge(target,patch){for(const k in patch){const v=patch[k];if(isObj(v)){if(!isObj(target[k]))target[k]={};merge(target[k],v)}else target[k]=v}return target}
function clean(o){if(!isObj(o))return o;const r={};for(const k in o){if(o[k]===null)continue;r[k]=isObj(o[k])?clean(o[k]):o[k]}return r}

function members(){const m=S.state.members||{};return Object.entries(m).filter(([,v])=>v&&!v.del).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0))}
function memberById(id){const v=(S.state.members||{})[id];return v&&!v.del?{id,...v}:null}

function allTasks(){
  const st=S.state.tasks||{};const out=[];
  for(const c of CATS)c.items.forEach(([title,f,r,tid])=>{const id=tid;const s=st[id]||{};out.push(build(id,{title,cat:c.id,f:s.f||f,r:r||"a",sl:s.sl||DEFSLOT[id]||"any",dw:Array.isArray(s.dw)?s.dw:[],due:s.due||"",custom:false},s))});
  for(const id in st){const s=st[id];if(s&&s.custom&&!s.del)out.push(build(id,{title:s.title,cat:CAT[s.cat]?s.cat:"dig",f:s.f||"g",r:"a",sl:s.sl||"any",dw:Array.isArray(s.dw)?s.dw:[],due:s.due||"",custom:true},s))}
  return out;
  function build(id,base,s){const as={};for(const m in (s.as||{})){if(s.as[m]&&memberById(m))as[m]=s.as[m]}const doneBy={};for(const m in (s.doneBy||{}))if(s.doneBy[m])doneBy[m]=s.doneBy[m];return {id,...base,as,doneBy,dbw:s.dbw||{},rot:!!s.rot&&base.f!=="t"}}
}
const lk=(t,m)=>t+"|"+m;
function logHas(day,tid,m){const L=S.logs[day];return !!(L&&L.e&&L.e[lk(tid,m)])}
function weekDays(w){return [0,1,2,3,4,5,6].map(i=>dkey(addDays(w,i)))}
const WD=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
function curDay(){return dkey(addDays(new Date(),S.dayOff||0))}
function kDate(k){return new Date(k+"T12:00:00")}
function activeOn(t,k){if(t.f!=="g"||!t.dw||!t.dw.length)return true;return t.dw.includes((kDate(k).getDay()+6)%7)}
function isDone(t,m,k){k=k||curDay();
  if(t.f==="g")return logHas(k,t.id,m);
  if(t.f==="h")return weekDays(monday(kDate(k))).some(x=>logHas(x,t.id,m));
  return !!t.doneBy[m];
}
const EPOCH=new Date(2024,0,1,12);/* bir pazartesi */
function rotMembers(t){return Object.keys(t.as).filter(id=>memberById(id)).sort((a,b)=>(memberById(a).order||0)-(memberById(b).order||0))}
function rotIndex(t,k){const d=kDate(k);const day=Math.round((d-EPOCH)/864e5);const wk=Math.floor(day/7);
  if(t.f==="h")return wk;
  if(t.dw&&t.dw.length&&t.dw.length<7){const ds=t.dw.slice().sort();return wk*ds.length+Math.max(0,ds.indexOf((d.getDay()+6)%7))}
  return day}
function onDuty(t,k){const ms=rotMembers(t);if(!ms.length)return null;const n=ms.length;return ms[((rotIndex(t,k)%n)+n)%n]}
function assignedOn(t,m,k){if(!t.as[m])return false;if(!t.rot||rotMembers(t).length<2)return true;return onDuty(t,k||curDay())===m}
function me(){const v=ls.get("agp-ben");return v&&memberById(v)?v:null}
function markedBy(t,m,k){k=k||curDay();let by=null;
  if(t.f==="g"){const L=S.logs[k];by=L&&L.e&&L.e[lk(t.id,m)]&&L.e[lk(t.id,m)].by}
  else if(t.f==="h"){for(const x of weekDays(monday(kDate(k)))){const L=S.logs[x];const v=L&&L.e&&L.e[lk(t.id,m)];if(v){by=v.by;break}}}
  else by=t.dbw[m];
  return by&&by!==m&&memberById(by)?memberById(by):null}
function dueInfo(t){if(t.f!=="t"||!t.due)return null;const d=Math.round((kDate(t.due)-kDate(dkey(new Date())))/864e5);
  const lbl=d<0?(-d)+" gün gecikti":d===0?"Son gün bugün":d===1?"Son gün yarın":kDate(t.due).toLocaleDateString(TR,{day:"numeric",month:"short"})+" son gün";
  return {d,lbl,cls:d<0?"low":d<=1?"warn":"none"}}
function freqLabel(t){if(t.f==="g"&&t.dw&&t.dw.length&&t.dw.length<7)return t.dw.slice().sort().map(i=>WD[i]).join(", ");return FREQ[t.f]}

const LOCAL_KEY="agp-yerel-v1";
function loadLocal(){try{const r=JSON.parse(ls.get(LOCAL_KEY)||"null");if(r&&r.state){S.state=r.state;S.logs=r.logs||{};return true}}catch(e){}return false}
function saveLocal(){
  const cut=dkey(addDays(new Date(),-60));const logs={};for(const k in S.logs)if(k>=cut)logs[k]=S.logs[k];S.logs=logs;
  ls.set(LOCAL_KEY,JSON.stringify({state:S.state,logs}));
}
/* Firebase (yalnızca Android uygulamasında): artifact db ile aynı arayüzü sunan küçük bağdaştırıcı */
function fbAdapter(){
  const fs=firebase.firestore();
  try{fs.enablePersistence().catch(()=>{})}catch(e){}
  const DEL=firebase.firestore.FieldValue.delete();
  const mapPath=p=>{const m=String(p).match(/^aile-([A-Z0-9]+)\/durum(?:\/(gun)(?:\/([0-9-]+))?)?$/);if(!m)throw new TypeError("Geçersiz yol: "+p);return "aileler/"+m[1]+(m[2]?"/gun"+(m[3]?"/"+m[3]:""):"")};
  const nullsToDel=o=>{const r={};for(const k in o){const v=o[k];r[k]=v===null?DEL:(isObj(v)?nullsToDel(v):v)}return r};
  const err=e=>({code:e&&e.code==="permission-denied"?"invalid_argument":e&&e.code==="resource-exhausted"?"quota_exceeded":"unavailable",message:String(e&&e.message||e)});
  const snapW=x=>({id:x.id,exists:x.exists,data:()=>x.data(),metadata:{fromCache:x.metadata.fromCache,hasPendingWrites:x.metadata.hasPendingWrites}});
  const docW=p=>{const r=fs.doc(mapPath(p));return {path:p,
    get:async()=>snapW(await r.get()),
    set:async d=>{try{await r.set(d)}catch(e){throw err(e)}},
    update:async d=>{try{await r.set(nullsToDel(d),{merge:true})}catch(e){throw err(e)}},
    onSnapshot:(n,er)=>r.onSnapshot({includeMetadataChanges:true},x=>n(snapW(x)),e=>er&&er(err(e)))}};
  const colW=(p,q)=>{q=q||fs.collection(mapPath(p));return {where:(f,op,v)=>colW(p,q.where(f,op,v)),
    onSnapshot:(n,er)=>q.onSnapshot({includeMetadataChanges:true},x=>n({docs:x.docs.map(snapW),size:x.size,empty:x.empty,metadata:{fromCache:x.metadata.fromCache}}),e=>er&&er(err(e)))}};
  return {doc:docW,collection:p=>colW(p)};
}
const queues={};
function enqueue(path,fn){if(S.fb){/* Firestore yazma sırasını kendisi tutar; çevrimdışıyken bekletmeden kuyruğa alır */const pr=fn();if(pr&&pr.catch)pr.catch(()=>{});return Promise.resolve()}const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
const base=()=>"aile-"+S.code;

async function patchState(patch){
  merge(S.state,patch);S.state=clean(S.state);
  if(S.mode==="local"){saveLocal();render();return}
  render();
  const ref=db.doc(base()+"/durum");
  return enqueue(ref.path,async()=>{
    try{await ref.update(patch)}
    catch(e){
      if(e&&e.code==="invalid_argument"){try{await ref.set(clean(JSON.parse(JSON.stringify(S.state))))}catch(e2){fail(e2)}}
      else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await ref.update(patch)}catch(e3){fail(e3)}}
      else fail(e);
    }
  });
}
async function setLog(day,key,val){
  if(!S.logs[day])S.logs[day]={date:day,e:{}};
  if(!S.logs[day].e)S.logs[day].e={};
  if(val)S.logs[day].e[key]=val;else delete S.logs[day].e[key];
  if(S.mode==="local"){saveLocal();render();return}
  render();
  const ref=db.doc(base()+"/durum/gun/"+day);
  return enqueue(ref.path,async()=>{
    const patch={date:day,e:{[key]:val||null}};
    try{await ref.update(patch)}
    catch(e){
      if(e&&e.code==="invalid_argument"){try{await ref.set({date:day,e:clean(S.logs[day].e)})}catch(e2){fail(e2)}}
      else fail(e);
    }
  });
}
function fail(e){
  const c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"||c==="revoked"){S.readOnly=true;toast("Bu bağlantıyla değişiklik kaydedilemiyor; sayfa yalnızca okunabilir.")}
  else if(c==="quota_exceeded")toast("Kayıt alanı doldu. Eski görevleri silip yeniden deneyin.");
  else toast("Kaydedilemedi. Bağlantınızı kontrol edip tekrar deneyin.");
  render();
}

function stopCloud(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function startCloud(code){
  stopCloud();S.code=code;S.ready=false;S.exists=true;S.logs={};S.state={name:"",members:{},tasks:{}};
  render();
  let timer=setTimeout(()=>{if(!S.ready){S.note="Aile verilerine şu an ulaşılamıyor. İnternet bağlantınızı kontrol edin; bağlantı gelince sayfa kendiliğinden güncellenir.";render()}},10000);
  unsubs.push(db.doc(base()+"/durum").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);S.note=null}
    if(snap.exists){S.state=clean(JSON.parse(JSON.stringify(snap.data())));S.exists=true;S.ready=true;ls.set("agp-kod",code)}
    else if(!snap.metadata.fromCache){S.exists=false;S.ready=true}
    render();
  },err=>{clearTimeout(timer);S.ready=true;S.note="Aile verileri okunamadı. Sayfayı daha sonra yeniden açın.";render()}));
  const cut=dkey(addDays(new Date(),-45));
  unsubs.push(db.collection(base()+"/durum/gun").where("date",">=",cut).onSnapshot(qs=>{
    const logs={};qs.docs.forEach(d=>{const v=d.data();logs[d.id]={date:v.date,e:clean(JSON.parse(JSON.stringify(v.e||{})))}});S.logs=logs;render();
  },()=>{}));
}

/* ---------- istatistik ---------- */
function rateCls(r){return r==null?"none":r>=80?"good":r>=50?"warn":"low"}
function pct(r){return r==null?"—":Math.round(r)+"%"}
function memberStats(mid,days){
  const today=new Date(),tk=dkey(today),start=addDays(today,-(days-1)),thisWeek=dkey(monday(today));
  let exp=0,done=0;const byCat={},byTask=[];
  for(const t of allTasks()){
    const at=t.as[mid];if(!at)continue;const atDay=dkey(new Date(at));let e=0,d=0;
    if(t.f==="g"){for(let i=0;i<days;i++){const k=dkey(addDays(start,i));if(k<atDay||!activeOn(t,k)||!assignedOn(t,mid,k))continue;const h=logHas(k,t.id,mid);if(k===tk&&!h)continue;e++;if(h)d++}}
    else if(t.f==="h"){let w=monday(start);while(w<=today){const wk=dkey(w),we=dkey(addDays(w,6));if(we>=atDay&&assignedOn(t,mid,wk)){const h=weekDays(w).some(k=>logHas(k,t.id,mid));if(!(wk===thisWeek&&!h)){e++;if(h)d++}}w=addDays(w,7)}}
    else{const h=!!t.doneBy[mid];e=1;d=h?1:0}
    exp+=e;done+=d;
    if(!byCat[t.cat])byCat[t.cat]={e:0,d:0,n:0};byCat[t.cat].e+=e;byCat[t.cat].d+=d;byCat[t.cat].n++;
    byTask.push({t,e,d});
  }
  return {exp,done,rate:exp?done/exp*100:null,byCat,byTask};
}
function dailyCounts(mids,n){
  const today=new Date();const out=[];
  for(let i=n-1;i>=0;i--){const d=addDays(today,-i),k=dkey(d);let c=0;const L=S.logs[k];
    if(L&&L.e)for(const key in L.e){if(!L.e[key])continue;const m=key.split("|")[1];if(mids.includes(m))c++}
    for(const t of allTasks())for(const m in t.doneBy)if(mids.includes(m)&&dkey(new Date(t.doneBy[m]))===k)c++;
    out.push({k,d,c,today:i===0})}
  return out;
}
function todayFor(mid,k){k=k||curDay();let tot=0,dn=0;for(const t of allTasks()){if(t.f!=="g"||!assignedOn(t,mid,k)||!activeOn(t,k))continue;tot++;if(isDone(t,mid,k))dn++}return {tot,dn}}
function weekFor(mid){let tot=0,dn=0;for(const t of allTasks()){if(t.f!=="h"||!assignedOn(t,mid))continue;tot++;if(isDone(t,mid))dn++}return {tot,dn}}

/* ---------- arayüz parçaları ---------- */
function roleOf(m){const r=ROLES[m.role]||"";return r.toLocaleLowerCase(TR)===String(m.name||"").trim().toLocaleLowerCase(TR)?"":r}
function av(m,cls){return m?`<span class="av ${cls||""}" style="background:${esc(m.color)}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`:""}
function ring(val,total,label){
  const r=52,c=2*Math.PI*r,p=total?val/total:0;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="lbl"><div><div class="big num">${total?Math.round(p*100):0}%</div><div class="muted">${esc(label)}</div></div></div></div>`;
}
function cols(data,fmt){
  const max=Math.max(1,...data.map(x=>x.c));
  return `<div class="cols">${data.map(x=>`<div class="col ${x.today?"today":""}" title="${esc(x.k)}: ${x.c}"><b class="num">${x.c||""}</b><i style="height:${(x.c/max*100).toFixed(1)}%"></i></div>`).join("")}</div><div class="xl">${data.map(x=>`<span>${fmt(x)}</span>`).join("")}</div>`;
}
function hbar(name,rate,right,color){const cls=rateCls(rate);return `<div class="hb"><span class="n" title="${esc(name)}">${color?`<span class="catdot" style="background:${color}"></span>`:""}${esc(name)}</span><div class="bar b-${cls}"><i style="width:${rate==null?0:Math.min(100,rate)}%"></i></div><span class="v num c-${cls}">${right}</span></div>`}
function byTag(t,m){const b=markedBy(t,m);return b?`<span class="byx">${esc(b.name)} işaretledi</span>`:""}
function checkBtn(t,m){const d=isDone(t,m);return `<button class="check" role="checkbox" aria-checked="${d}" aria-label="${esc(t.title)} tamamlandı" data-act="toggle" data-t="${t.id}" data-m="${m}" ${S.readOnly?"disabled":""}>${ICON.check}</button>`}
function freqTag(t){const di=dueInfo(t);return `${t&&t.rot&&rotMembers(t).length>1?`<span class="tag rot">Nöbet · bugün ${esc(memberById(onDuty(t,dkey(new Date()))).name)}</span>`:""}<span class="tag">${esc(typeof t==="string"?FREQ[t]:freqLabel(t))}</span>${di?`<span class="tag due-${di.cls}">${esc(di.lbl)}</span>`:""}`}

function nav(){
  const html=TABS.map(([id,l,ic])=>`<button class="tab" data-go="${id}" ${S.view===id?'aria-current="page"':""}>${ICON[ic]}<span>${l}</span></button>`).join("");
  $("#tabbar").innerHTML=html;$("#railTabs").innerHTML=html;
  $("#railFam").textContent=S.state.name||"Evin ortak planı";
  const hasFam=S.ready&&S.exists&&members().length>=0&&(S.mode==="local"?!!S.state.created:true);
  $("#tabbar").hidden=!hasFam;document.querySelector(".rail").hidden=!hasFam;
}

  const fr=$("#focusRoot");const fh=S.focus&&S.ready!==false?focusView():"";if(fr.innerHTML!==fh){const sc=fr.firstElementChild?fr.firstElementChild.scrollTop:0;fr.innerHTML=fh;if(fr.firstElementChild)fr.firstElementChild.scrollTop=sc}document.body.style.overflow=fh?"hidden":"";
  if(!S.mode){v.innerHTML=`<div class="empty"><h3>Aile Görev Panosu yükleniyor</h3><p>Ailenizin görevleri birazdan burada.</p></div>`;return}

  if(S.mode==="cloud"&&!S.ready)return v.innerHTML=`<div class="empty"><h3>Aile bilgileri getiriliyor</h3><p>Aile kodu: <b>${esc(fmtCode(S.code))}</b></p>${S.note?`<p class="note">${esc(S.note)}</p>`:""}<button class="btn" data-act="leave">Başka bir aile koduyla gir</button></div>`;

function pBugun(){
  const ms=members(),K=curDay(),today=kDate(K);
  const dateStr=today.toLocaleDateString(TR,{weekday:"long",day:"numeric",month:"long"});
  let tot=0,dn=0;const pending=[];
  const tasks=allTasks();
  for(const m of ms){const r=todayFor(m.id);tot+=r.tot;dn+=r.dn}
  for(const t of tasks){if(t.f!=="g"||!activeOn(t,K))continue;for(const m in t.as){const mm=memberById(m);if(!mm||!assignedOn(t,m,K))continue;pending.push({t,m:mm,d:isDone(t,m)})}}
  pending.sort((a,b)=>(a.d-b.d)||cmp(a.m.name,b.m.name)||cmp(a.t.title,b.t.title));
  let wt=0,wd=0;for(const m of ms){const r=weekFor(m.id);wt+=r.tot;wd+=r.dn}
  const unassigned=tasks.filter(t=>!Object.keys(t.as).length).length;
  if(!ms.length)return head("Bugün",dateStr)+`<div class="card empty"><h3>Önce aile üyelerini ekleyin</h3><p>Görevleri kişilere atayabilmek için Aile sayfasından anne, baba ve çocukları ekleyin.</p><button class="btn primary" data-go="aile">Üye ekle</button></div>`;
  const order=Object.fromEntries(SLOTS.map((x,i)=>[x[0],i]));const cur=S.dayOff?null:nowSlot();
  const groups=SLOTS.map(([k,l])=>({k,l,items:pending.filter(x=>x.t.sl===k)})).filter(g=>g.items.length);
  const dayLbl=S.dayOff?"dün":"bugün";
  const dueList=[];for(const t of tasks){if(t.f!=="t"||!t.due)continue;const di=dueInfo(t);if(di.d>3)continue;for(const m in t.as){if(!t.doneBy[m]&&memberById(m))dueList.push({t,m:memberById(m),di})}}
  dueList.sort((a,b)=>a.di.d-b.di.d);
  const daySeg=`<div class="seg" role="group" aria-label="Gün"><button data-act="dayOff" data-v="-1" aria-pressed="${S.dayOff===-1}">Dün</button><button data-act="dayOff" data-v="0" aria-pressed="${!S.dayOff}">Bugün</button></div>`;
  return head(S.state.name||"Bugün",(S.dayOff?"Dünü tamamlıyorsunuz":greet())+" · "+dateStr[0].toLocaleUpperCase(TR)+dateStr.slice(1),daySeg)+`
  ${S.dayOff?`<div class="note"><b>Dünün listesi açık.</b> Unutulan işleri işaretleyin; dünün oranı düzelir. Bitince “Bugün”e dönün.</div>`:""}
  <div class="card hero">${ring(dn,tot,dayLbl)}
    <div class="kpis">
      <div class="kpi"><div class="v num">${dn}/${tot}</div><div class="k">${S.dayOff?"Dün":"Bugün"} yapılan günlük görev</div></div>
      <div class="kpi"><div class="v num">${wd}/${wt}</div><div class="k">Haftalık görev bu hafta</div></div>
      <div class="kpi"><div class="v num">${tasks.length-unassigned}</div><div class="k">Atanmış görev</div></div>
    </div></div>
  ${S.dayOff?"":notesBoard()}
  ${!S.dayOff&&dueList.length?`<section class="card"><div class="card-head"><h2>Yaklaşan ve geciken işler</h2><span class="muted">3 gün içinde son günü olanlar</span></div><div class="list">${dueList.map(x=>`<div class="row">${checkBtn(x.t,x.m.id)}<div class="tt"><div class="t1">${esc(x.t.title)}</div><div class="t2"><span class="tag due-${x.di.cls}">${esc(x.di.lbl)}</span><span><span class="catdot" style="background:${CAT[x.t.cat].color}"></span>${esc(CAT[x.t.cat].name)}</span></div></div>${av(x.m)}</div>`).join("")}</div></section>`:""}
  <div><div class="card-head"><h2 style="font-size:18px">Kim ne durumda</h2><span class="muted">${S.dayOff?"Dünkü":"Bugünkü"} günlük görevler</span></div>
  <div class="mboxes">${ms.map(m=>{const r=todayFor(m.id);const rate=r.tot?r.dn/r.tot*100:null;const cls=rateCls(rate);return `<button class="mbox" data-act="openMember" data-m="${m.id}"><div class="top">${av(m,"lg")}<div><div class="nm">${esc(m.name)}</div><div class="rl">${roleOf(m)}</div></div></div><div style="display:flex;align-items:baseline;justify-content:space-between"><span class="big num c-${cls}">${pct(rate)}</span><span class="muted num">${r.dn}/${r.tot}</span></div><div class="bar b-${cls}"><i style="width:${rate||0}%"></i></div></button>`}).join("")}</div></div>
  <div class="card"><div class="card-head"><h2>${S.dayOff?"Dünün listesi":"Bugünün listesi"}</h2><span class="muted num">${pending.filter(x=>!x.d).length} görev kaldı</span></div>
  ${pending.length?`<div class="slots">${groups.map(g=>{const left=g.items.filter(x=>!x.d).length;return `<div class="slot ${g.k===cur?"now":""}"><div class="slot-h"><span class="slot-ic s-${g.k}"></span><b>${g.l}</b>${g.k===cur?'<span class="pill p-now">Şimdi</span>':""}<span class="muted num" style="margin-left:auto">${left?left+" kaldı":"tamam"}</span></div><div class="list">${g.items.map(x=>`<div class="row ${x.d?"done":""}">${checkBtn(x.t,x.m.id)}<div class="tt"><div class="t1">${esc(x.t.title)}</div><div class="t2">${x.t.rot&&rotMembers(x.t).length>1?`<span class="tag rot">Nöbet</span>`:""}<span><span class="catdot" style="background:${CAT[x.t.cat].color}"></span>${esc(CAT[x.t.cat].name)}</span>${byTag(x.t,x.m.id)}</div></div>${av(x.m)}</div>`).join("")}</div></div>`}).join("")}</div>`
  :`<div class="empty"><h3>Bugün için atanmış günlük görev yok</h3><p>Görevler sayfasından “Her gün” yapılacak işleri kişilere atayın.</p><button class="btn primary" data-go="gorevler">Görevlere git</button></div>`}
  </div>`;
}
function notesBoard(){

  :`<button class="note-empty" data-act="newNote" ${S.readOnly?"disabled":""}><b>Henüz not yok.</b> “Cuma veli toplantısı”, “Akşam yemeği 19.00” gibi herkesin görmesi gereken kısa notları buraya bırakın.</button>`}</section>`;
}
function focusView(){
  const m=memberById(S.focus);if(!m){S.focus=null;return ""}
  const today=allTasks().filter(t=>assignedOn(t,m.id,curDay())&&t.f==="g"&&activeOn(t,curDay()));
  const week=allTasks().filter(t=>assignedOn(t,m.id,curDay())&&t.f==="h");
  const once=allTasks().filter(t=>t.as[m.id]&&t.f==="t"&&!isDone(t,m.id));
  const dn=today.filter(t=>isDone(t,m.id)).length;
  const row=t=>{const d=isDone(t,m.id);return `<button class="frow ${d?"done":""}" data-act="toggle" data-t="${t.id}" data-m="${m.id}" role="checkbox" aria-checked="${d}" ${S.readOnly?"disabled":""}><span class="fbox">${ICON.check}</span><span class="ftxt">${esc(t.title)}</span></button>`};
  const bySlot=SLOTS.map(([k,l])=>({l,items:today.filter(t=>t.sl===k).sort((a,b)=>cmp(a.title,b.title))})).filter(g=>g.items.length);
  const all=today.length&&dn===today.length;
  return `<div class="focus" role="dialog" aria-modal="true" aria-label="${esc(m.name)} için bugünkü liste" style="--mc:${esc(m.color)}">
   <div class="focus-in">
    <div class="focus-top"><div class="focus-who">${av(m,"lg")}<div><div class="eyebrow">${greet()}</div><div class="focus-name">${esc(m.name)}</div></div></div><button class="btn" data-act="closeFocus">Kapat</button></div>
    <div class="focus-prog"><div class="num"><b>${dn}</b> / ${today.length} bugün</div><div class="bar"><i style="width:${today.length?dn/today.length*100:0}%;background:var(--mc)"></i></div></div>
    ${all?`<div class="focus-done">Bugünkü listen tamam. Elinize sağlık!</div>`:""}
    ${bySlot.map(g=>`<h3 class="focus-h">${g.l}</h3><div class="flist">${g.items.map(row).join("")}</div>`).join("")}
    ${week.length?`<h3 class="focus-h">Bu hafta</h3><div class="flist">${week.map(row).join("")}</div>`:""}
    ${once.length?`<h3 class="focus-h">Unutma</h3><div class="flist">${once.map(row).join("")}</div>`:""}
    ${!today.length&&!week.length&&!once.length?`<p class="lead">Bugün için atanmış görev yok.</p>`:""}

function weekPlan(m){

  const tasks=allTasks().filter(t=>t.as[m.id]&&t.f!=="t");
  const rotOn=t=>t.rot&&rotMembers(t).length>1;
  const fixed=tasks.filter(t=>t.f==="g"&&!rotOn(t)&&(!t.dw||!t.dw.length));
  const varying=tasks.filter(t=>t.f==="g"&&(rotOn(t)||(t.dw&&t.dw.length)));
  const weekly=tasks.filter(t=>t.f==="h"&&rotOn(t));
  if(!varying.length&&!weekly.length)return "";
  const wk=weekly.filter(t=>assignedOn(t,m.id,tk));
  return `<section class="card"><div class="card-head"><h2>Bu haftanın planı</h2><span class="muted">nöbetler ve belirli günler</span></div>
  <div class="plan-wrap"><div class="plan">${days.map((k,i)=>{const items=varying.filter(t=>activeOn(t,k)&&assignedOn(t,m.id,k)).sort((a,b)=>cmp(a.title,b.title));
    return `<div class="pday ${k===tk?"today":""} ${k<tk?"past":""}"><div class="pd-h">${WD[i]}<small class="num">${+k.slice(8)}</small></div>${items.map(t=>{const ok=isDone(t,m.id,k);return `<div class="pchip ${ok?"ok":""}" style="--c:${CAT[t.cat].color}" title="${esc(t.title)}">${ok?"✓ ":""}${esc(t.title)}</div>`}).join("")||'<div class="pempty">Boş</div>'}</div>`}).join("")}</div></div>

}

document.addEventListener("click",async ev=>{

  case "shareFam":{if(!S.fb||S.mode!=="local")break;const code=genCode();const st=JSON.parse(JSON.stringify(S.state));const lg=JSON.parse(JSON.stringify(S.logs));
    db.doc("aile-"+code+"/durum").set(clean(st)).catch(()=>toast("Sunucuya kaydedilemedi. İnternet bağlantınızı kontrol edin."));

  case "undo":{const f=undoFn;undoFn=null;$("#toastRoot").innerHTML="";if(f)await f();break}
  case "cat":S.cat=el.dataset.v;S.q="";render();{const ch=document.querySelector('.chip[aria-pressed="true"]');if(ch)ch.scrollIntoView({block:"nearest",inline:"center"})}window.scrollTo(0,0);break;
  case "dayOff":S.dayOff=+el.dataset.v;render();break;
  case "dDay":{syncDraftInputs();const i=+el.dataset.v;const a=new Set(draft.dw||[]);a.has(i)?a.delete(i):a.add(i);draft.dw=[...a].sort();if(draft.dw.length===7)draft.dw=[];taskSheet();break}
  case "filter":S.filter=el.dataset.v;render();break;
  case "atab":S.analizTab=el.dataset.v;render();break;
  case "period":S.period=+el.dataset.v;render();break;
  case "pickMember":S.member=el.dataset.m;render();break;
  case "pickAMember":S.amember=el.dataset.m;render();break;
  case "openMember":S.member=el.dataset.m;S.dayOff=0;go("kisiler");break;
  case "openAnaliz":S.amember=el.dataset.m;S.analizTab="birey";go("analiz");break;
  case "newTaskCat":if(S.readOnly)return;draft={isNew:true,custom:true,title:"",cat:el.dataset.v,f:"g",sl:"any",dw:[],due:"",as:{},orig:{}};taskSheet();break;
  case "dupTask":{syncDraftInputs();const base=draft;draft={isNew:true,custom:true,title:base.title,cat:base.cat,f:base.f,sl:base.sl||"any",dw:[...(base.dw||[])],due:base.due||"",as:{},orig:{}};taskSheet();setTimeout(()=>{const i=$("#tTitle");if(i){i.focus();i.select()}},30);toast("Kopya hazır. Adını değiştirip kaydedin.");break}
  case "newTask":if(S.readOnly)return;draft={isNew:true,custom:true,title:"",cat:S.cat!=="all"?S.cat:"tem",f:"g",sl:"any",dw:[],due:"",as:{},orig:{}};taskSheet();break;
  case "editTask":{if(S.readOnly){toast("Yalnızca görüntüleme modundasınız");return}const t=allTasks().find(x=>x.id===el.dataset.t);if(!t)return;draft={isNew:false,id:t.id,custom:t.custom,title:t.title,cat:t.cat,f:t.f,r:t.r,sl:t.sl,origSl:t.sl,dw:[...(t.dw||[])],due:t.due||"",rot:t.rot,as:{...t.as},orig:{...t.as}};taskSheet();break}
  case "dFreq":syncDraftInputs();draft.f=el.dataset.v;taskSheet();break;
  case "dMem":{syncDraftInputs();const m=el.dataset.m;if(draft.as[m])delete draft.as[m];else draft.as[m]=Date.now();taskSheet();break}
  case "clearAs":syncDraftInputs();draft.as={};taskSheet();break;
  case "askDel":$("#delZone").innerHTML=`<div class="confirm"><b>“${esc(draft.title)}” silinsin mi?</b><span class="muted">Görev listeden ve analizlerden kalkar.</span><div class="actions"><button class="btn sm" data-act="cancelDel">Vazgeç</button><button class="btn sm danger" data-act="doDel">Evet, sil</button></div></div>`;break;
  case "cancelDel":$("#delZone").innerHTML="";break;
  case "doDel":await patchState({tasks:{[draft.id]:{del:true}}});closeSheet();toast("Görev silindi");break;
  case "saveTask":{
    syncDraftInputs();
    if((draft.isNew||draft.custom)&&!draft.title.trim()){$("#tTitle").focus();toast("Görev adını yazın");return}
    const asPatch={};for(const m in draft.orig)if(!draft.as[m])asPatch[m]=null;for(const m in draft.as)asPatch[m]=draft.orig[m]||Date.now();
    if(draft.isNew){const id="o"+uid();await patchState({tasks:{[id]:{custom:true,title:draft.title.trim(),cat:draft.cat,f:draft.f,sl:draft.sl||"any",dw:draft.f==="g"?draft.dw:[],due:draft.f==="t"?(draft.due||""):"",rot:!!draft.rot&&draft.f!=="t"&&Object.keys(draft.as).length>1,as:asPatch}}});toast("Görev eklendi");}
    else{const p={f:draft.f,as:asPatch,dw:draft.f==="g"?draft.dw:[],due:draft.f==="t"?(draft.due||""):"",rot:!!draft.rot&&draft.f!=="t"&&Object.keys(draft.as).length>1};if(draft.sl!==draft.origSl)p.sl=draft.sl;if(draft.custom){p.title=draft.title.trim();p.cat=draft.cat}await patchState({tasks:{[draft.id]:p}});toast("Kaydedildi")}
    closeSheet();break}
  case "addMember":{const n=$("#nmName").value.trim();if(!n){$("#nmName").focus();return}const ms=members();await patchState({members:{[uid()]:{name:n,role:$("#nmRole").value,color:nextColor(),order:(ms.length?Math.max(...ms.map(m=>m.order||0))+1:0)}}});toast(n+" eklendi");break}
  case "editMember":{const m=memberById(el.dataset.m);if(!m)return;openSheet(`<div><div class="eyebrow">Aile üyesi</div><h3>${esc(m.name)}</h3></div>
    <div class="field"><label for="emName">İsim</label><input class="input" id="emName" value="${esc(m.name)}"></div>
    <div class="field"><label for="emRole">Rol</label><select class="input" id="emRole">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${m.role===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><span class="flabel">Renk</span><div class="pick">${MCOLORS.map(c=>`<button data-act="emColor" data-c="${c}" aria-pressed="${m.color===c}" aria-label="Renk" style="padding:4px"><span class="av" style="background:${c}"></span></button>`).join("")}</div></div>
    <div id="delZone"></div>
    <div class="actions"><button class="btn danger" data-act="askDelM" data-m="${m.id}">Üyeyi kaldır</button><button class="btn" data-act="closeSheet">Vazgeç</button><button class="btn primary" data-act="saveMember" data-m="${m.id}">Kaydet</button></div>`);sheet={color:m.color};break}
  case "emColor":sheet.color=el.dataset.c;document.querySelectorAll('[data-act="emColor"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===sheet.color));break;
  case "saveMember":{const n=$("#emName").value.trim();if(!n)return;await patchState({members:{[el.dataset.m]:{name:n,role:$("#emRole").value,color:sheet.color}}});closeSheet();toast("Kaydedildi");break}
  case "askDelM":$("#delZone").innerHTML=`<div class="confirm"><b>Bu üye kaldırılsın mı?</b><span class="muted">Üyenin görev atamaları ve analizleri görünmez olur.</span><div class="actions"><button class="btn sm" data-act="cancelDel">Vazgeç</button><button class="btn sm danger" data-act="doDelM" data-m="${el.dataset.m}">Evet, kaldır</button></div></div>`;break;
  case "doDelM":await patchState({members:{[el.dataset.m]:{del:true}}});closeSheet();toast("Üye kaldırıldı");break;
  case "saveName":{const n=$("#famName").value.trim();if(!n)return;await patchState({name:n});toast("Aile adı kaydedildi");break}
  case "exportBk":{const txt=backupText();$("#bk").value=txt;$("#bk").select();copy(txt);break}
  case "saveBk":{const txt=backupText();const fn="aile-gorev-yedek-"+dkey(new Date())+".json";
    if(window.AndroidBridge&&window.AndroidBridge.saveFile){window.AndroidBridge.saveFile(fn,txt);break}
    try{const dl=window.claude&&await window.claude.use("downloads");if(dl){await dl.save({filename:fn,data:new Blob([txt],{type:"application/json"})});toast("Yedek kaydedildi");break}}catch(e){if(e&&e.code==="declined")break}
    const ta=$("#bk");ta.value=txt;ta.closest("details").open=true;ta.select();copy(txt);break}
  case "importBk":{try{const o=JSON.parse($("#bk").value);if(!o||o.uygulama!=="aile-gorev-panosu"||!o.state)throw 0;
      if(S.mode==="local"){S.state=o.state;S.logs=o.logs||{};saveLocal();render()}
      else{await db.doc(base()+"/durum").set(clean(o.state));for(const k in (o.logs||{})){await db.doc(base()+"/durum/gun/"+k).set({date:k,e:clean(o.logs[k].e||{})})}}
      toast("Yedek yüklendi")}catch(e){toast("Bu metin geçerli bir yedek değil")}break}
  case "dSlot":syncDraftInputs();draft.sl=el.dataset.v;taskSheet();break;
  case "openFocus":S.focus=el.dataset.m;S.dayOff=0;render();break;
  case "closeFocus":S.focus=null;render();break;
  case "copySummary":copy($("#sumText").textContent);break;
  case "newNote":{if(S.readOnly)return;const ms=members();sheet={c:"marker"};openSheet(`<div><div class="eyebrow">Buzdolabı notu</div><h3>Herkesin görmesi gereken kısa bir not</h3></div>
    <div class="field"><label for="nText">Not</label><textarea class="input plain" id="nText" maxlength="140" placeholder="Örn. Perşembe 18.00 veli toplantısı"></textarea><span class="muted" id="nCount">0/140</span></div>
    <div class="field"><label for="nBy">Kimden</label><select class="input" id="nBy"><option value="">Belirtme</option>${ms.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></div>
    <div class="field"><span class="flabel">Not rengi</span><div class="pick">${NOTE_COLORS.map(c=>`<button data-act="nColor" data-c="${c}" aria-pressed="${c==="marker"}" aria-label="Renk" style="padding:4px"><span class="swatch n-${c}"></span></button>`).join("")}</div></div>
    <div class="actions"><button class="btn" data-act="closeSheet">Vazgeç</button><button class="btn primary" data-act="saveNote">Panoya as</button></div>`);$("#nText").focus();break}
  case "nColor":sheet.c=el.dataset.c;document.querySelectorAll('[data-act="nColor"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===sheet.c));break;
  case "saveNote":{const t=$("#nText").value.trim();if(!t){$("#nText").focus();return}await patchState({notes:{["n"+uid()]:{text:t.slice(0,140),c:sheet.c,by:$("#nBy").value||null,at:Date.now()}}});closeSheet();toast("Not panoya asıldı");break}
  case "delNote":await patchState({notes:{[el.dataset.id]:null}});toast("Not kaldırıldı");break;
  case "closeSheet":closeSheet();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet)closeSheet();else if(e.key==="Escape"&&S.focus){S.focus=null;render()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".row.tap")){e.preventDefault();e.target.click()}
  if(e.key==="Enter"&&e.target.id==="mName"){e.preventDefault();document.querySelector('[data-act="onbAdd"]').click()}
  if(e.key==="Enter"&&e.target.id==="nmName"){e.preventDefault();document.querySelector('[data-act="addMember"]').click()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="remOn"||/^rem-/.test(e.target.id)){saveRem();return}
  if(e.target.id==="tRot"){syncDraftInputs();taskSheet();return}
  if(e.target.id==="meSel"){if(e.target.value)ls.set("agp-ben",e.target.value);else ls.del("agp-ben");toast(e.target.value?"Bu cihaz "+memberById(e.target.value).name+" olarak ayarlandı":"Ortak cihaz olarak ayarlandı");render()}
  if(e.target.id==="bkFile"&&e.target.files&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>importBackupText(String(r.result||""));r.readAsText(f);e.target.value=""}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
  if(e.target.id==="fName")onbDraft.name=e.target.value;
  if(e.target.id==="starter")onbDraft.starter=e.target.checked;
  if(e.target.id==="nText"){const c=$("#nCount");if(c)c.textContent=e.target.value.length+"/140"}
});
const VIEWS=TABS.map(t=>t[0]).concat("rehber");
window.__agpBack=()=>{if(sheet){closeSheet();return true}if(S.view==="gorevler"&&(S.q||CAT[S.cat])){S.q="";S.cat="all";render();return true}if(S.focus){S.focus=null;render();return true}if(S.setup){S.setup=null;render();return true}const fam=S.mode==="local"?!!S.state.created:(S.ready&&S.exists&&S.code);if(fam&&S.view!=="bugun"){go("bugun");return true}return false};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==S.view){S.view=h;render()}});

/* ---------- başlangıç ---------- */
(async function boot(){
  const h=location.hash.slice(1);S.view=VIEWS.includes(h)?h:(ls.get("agp-sekme")||"bugun");
  if(window.__AGP_FB&&window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(window.__AGP_FB);db=fbAdapter();S.fb=true}catch(e){db=null;S.fb=false}}
  if(S.fb){const code=ls.get("agp-kod");
    if(code){S.mode="cloud";startCloud(code)}
    else if(loadLocal()&&S.state.created){S.mode="local";S.ready=true;render()}
    else{S.mode="cloud";render()}
    let last0=dkey(new Date());setInterval(()=>{const k=dkey(new Date());if(k!==last0){last0=k;render()}},60000);
    return}
  let canWrite=null;
  try{if(window.claude&&window.claude.use){[db,userCap]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(userCap&&userCap.can)canWrite=await userCap.can("data.write")}}catch(e){db=null}
  if(db&&canWrite!==false){S.mode="cloud";const code=ls.get("agp-kod");if(code)startCloud(code);else render()}
  else{S.mode="local";loadLocal();S.ready=true;render()}
  // gün değişince ekranı yenile
  let last=dkey(new Date());setInterval(()=>{const k=dkey(new Date());if(k!==last){last=k;render()}},60000);
})();
render();
})();
</script>
</body></html>
